<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMT Live Transit</title>
<meta name="description" content="Live map of Lanka Metro Transit (LMT) buses in Colombo — real-time bus positions, routes, stops, arrival predictions and service alerts from LMT's open GTFS and GTFS-Realtime feeds.">
<meta name="theme-color" content="#121417">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121417'/%3E%3Crect x='7' y='6' width='18' height='17' rx='3' fill='%23f2a51a'/%3E%3Crect x='9.5' y='9' width='13' height='6' rx='1' fill='%23121417'/%3E%3Ccircle cx='11' cy='25' r='2' fill='%23f2a51a'/%3E%3Ccircle cx='21' cy='25' r='2' fill='%23f2a51a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="map" role="application" aria-label="Map of live LMT buses"></div>

<header class="topbar">
  <div class="brand">
    <h1>LMT&nbsp;LIVE</h1>
    <div class="sub">Lanka Metro Transit</div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Connecting…</div>
  <div class="health" aria-label="Feed status">
    <span class="dot" id="h-static" title="Schedule"><b></b><span class="lbl">GTFS</span></span>
    <span class="dot" id="h-vehicles" title="Live bus positions"><b></b><span class="lbl">Buses</span></span>
    <span class="dot" id="h-tripUpdates" title="Arrival predictions"><b></b><span class="lbl">ETA</span></span>
    <span class="dot" id="h-alerts" title="Service alerts"><b></b><span class="lbl">Alerts</span></span>
  </div>
  <div class="actions">
    <button class="icon-btn" id="refresh" title="Refresh now" aria-label="Refresh now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn" id="locate" title="Stops near me" aria-label="Show stops near me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="icon-btn" id="theme" title="Toggle dark / light" aria-label="Toggle dark or light theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
</header>

<div class="banner" id="banner" role="alert"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<section class="panel" id="panel" aria-label="Transit data">
  <button class="grab" aria-label="Expand or collapse panel"><i></i></button>
  <div class="search"><input id="q" type="search" placeholder="Search buses, plates, stops…" aria-label="Search" autocomplete="off"></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-pane="vehicles" aria-controls="pane-vehicles">Buses<span class="count" id="c-vehicles">0</span></button>
    <button role="tab" aria-selected="false" data-pane="routes" aria-controls="pane-routes" tabindex="-1">Routes<span class="count" id="c-routes">0</span></button>
    <button role="tab" aria-selected="false" data-pane="stops" aria-controls="pane-stops" tabindex="-1">Stops<span class="count" id="c-stops">0</span></button>
    <button role="tab" aria-selected="false" data-pane="alerts" aria-controls="pane-alerts" tabindex="-1">Alerts<span class="count" id="c-alerts">0</span></button>
  </div>
  <div class="tabpanes">
    <div class="pane show" id="pane-vehicles" role="tabpanel"><div class="empty">Connecting to live buses…</div></div>
    <div class="pane" id="pane-routes" role="tabpanel"><div class="empty">Loading routes…</div></div>
    <div class="pane" id="pane-stops" role="tabpanel"><div class="empty">Loading stops…</div></div>
    <div class="pane" id="pane-alerts" role="tabpanel"><div class="empty">Checking for service alerts…</div></div>
  </div>
  <footer class="footer">
    <details><summary>Feed status</summary><ul id="feed-details" class="feeds"></ul></details>
    <div>Data: <a href="https://mobilitydatabase.org/feeds/gtfs/mdb-3490" target="_blank" rel="noopener">Lanka Metro Transit</a> (CC-BY-4.0). Unofficial — not affiliated with LMT.</div>
  </footer>
</section>

<div class="loader" id="loader"><div class="box"><div class="m">LMT LIVE</div><div class="spin"></div><div class="msg">Loading routes &amp; live buses…</div></div></div>

<noscript><div class="noscript">LMT Live needs JavaScript to load the live bus feeds.</div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.2.6/protobuf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/lmt-core.js"></script>
<script>
  /* Optional overrides, e.g. a CORS proxy:
     window.LMT_CONFIG = { fallbackApi: "https://lmt-proxy.example.workers.dev/api/v1" }; */
</script>
<script src="assets/app.js"></script>
</body>
</html>
